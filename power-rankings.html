<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Power Rankings | PUCK'D</title>

    <link rel="stylesheet" href="styles.css">

    <link rel="stylesheet" href="css/power-rankings.css">

</head>

<body class="pr-page">

<div id="ticker"></div>

<div id="navbar"></div>

<header class="page-head pr-hero">

    <div class="wrap">

        <h1 class="page-head-title pr-title">PUCK'D Sweet 16</h1>

        <p class="page-head-dek pr-dek">
            The PUCK'D desk ranks the league's best sixteen every week.
            Arrows track movement against last week's board.
        </p>

        <div class="pr-meta" id="prMeta" aria-live="polite">
            <span class="pb-chip" id="updatedDate">Loading board</span>
        </div>

    </div>

</header>

<main class="pr-main">

    <div class="wrap">

        <section class="pr-movers" id="prMovers" aria-label="Biggest moves this week" hidden></section>

        <div class="power-rankings pr-board"
             id="powerRankings"
             aria-busy="true">

        </div>

    </div>

</main>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="script.js"></script>

<script src="navbar.js"></script>

<script src="power-rankings.js"></script>

</body>

</html>
