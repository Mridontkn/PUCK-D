<script>
function getQueryParam(n){return new URLSearchParams(window.location.search).get(n)}

function formatFullDate(iso){
    if(!iso) return '';
    var d=new Date(iso);
    if(isNaN(d.getTime())) return String(iso);
    return d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
}

function articleReadTime(html){
    var text=(html||'').replace(/<[^>]*>/g,' ');
    var words=text.trim().split(/\s+/).filter(Boolean).length;
    return Math.max(1,Math.round(words/200))+' min read';
}

var _raf=false;
window.addEventListener('scroll',function(){
    if(!_raf){
        requestAnimationFrame(function(){
            var bar=document.getElementById('readingProgress');
            var content=document.querySelector('.article-content');
            if(bar&&content){
                var rect=content.getBoundingClientRect();
                var scrolled=Math.max(0,-rect.top);
                var total=content.offsetHeight-window.innerHeight;
                var pct=total<=0?1:Math.min(1,Math.max(0,scrolled/total));
                bar.style.transform='scaleX('+pct+')';
            }
            _raf=false;
        });
        _raf=true;
    }
},{passive:true});

async function loadArticle(){
    var slug=getQueryParam('slug');
    if(!slug){
        document.getElementById('articleTitle').textContent='Article not found';
        document.getElementById('articleBody').innerHTML='<p>No article slug was provided.</p>';
        return;
    }
    try{
        var result=await db.from('article').select('*').eq('web_link',slug).single();
        var article=result.data;
        if(result.error||!article){
            document.getElementById('articleTitle').textContent='Article not found';
            document.getElementById('articleDek').textContent='This article may have been removed or the URL is incorrect.';
            document.getElementById('articleBody').innerHTML='';
            return;
        }

        document.title=article.title+' | PUCK\'D';

        var heroBg=document.getElementById('articleHeroBg');
        var heroSection=document.getElementById('articleHero');
        if(article.image_url){
            heroBg.style.backgroundImage='url('+article.image_url+')';
            heroSection.classList.add('has-image');
        }

        document.getElementById('articleTag').textContent=article.category||'News';
        document.getElementById('articleTitle').textContent=article.title;

        var dekEl=document.getElementById('articleDek');
        if(article.summary){dekEl.textContent=article.summary}
        else{dekEl.style.display='none'}

        document.getElementById('articleAuthor').textContent=article.author||'';
        document.getElementById('articleReadTime').textContent=articleReadTime(article.context);
        document.getElementById('articleDate').textContent=formatFullDate(article.created_at);

        document.getElementById('articleBody').innerHTML=article.context||'';

        document.getElementById('articleTag').dataset.cat=(article.category||'news').toLowerCase();

        var authorCard=document.getElementById('authorCard');
        if(article.author){
            document.getElementById('authorAvatar').textContent=article.author.charAt(0).toUpperCase();
            document.getElementById('authorName').textContent=article.author;
            authorCard.style.display='';
        }

        var shareUrl=encodeURIComponent(window.location.href);
        var shareText=encodeURIComponent(article.title+' | PUCK\'D');
        document.getElementById('shareLink').href='https://x.com/intent/tweet?url='+shareUrl+'&text='+shareText;

        loadRelated(article.category,slug);
    }catch(err){
        console.error(err);
        document.getElementById('articleTitle').textContent='Unable to load article';
        document.getElementById('articleBody').innerHTML='<p>Check your connection and try again.</p>';
    }
}

async function loadRelated(category,currentSlug){
    try{
        var result=await db
            .from('article')
            .select('*')
            .neq('web_link',currentSlug)
            .order('created_at',{ascending:false})
            .limit(3);

        if(result.error||!result.data||!result.data.length) return;

        var grid=document.getElementById('relatedGrid');
        grid.innerHTML=result.data.map(function(a){
            var img=a.image_url
                ? '<img class="related-card-image" src="'+escapeHtml(a.image_url)+'" alt="'+escapeHtml(a.title)+'">'
                : '<div class="related-card-image related-card-no-image"></div>';
            return '<a class="related-card" href="article.html?slug='+encodeURIComponent(a.web_link)+'">'
                +img
                +'<div class="related-card-body">'
                +'<span class="article-tag">'+escapeHtml(a.category||'News')+'</span>'
                +'<h3 class="related-card-title">'+escapeHtml(a.title)+'</h3>'
                +'<div class="related-card-meta">'+escapeHtml(a.author||'')+' · '+formatFullDate(a.created_at)+'</div>'
                +'</div></a>';
        }).join('');

        document.getElementById('relatedSection').style.display='';
    }catch(err){
        console.error('Failed to load related articles',err);
    }
}

loadArticle();
</script>
