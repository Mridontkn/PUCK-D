<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
    <title>Articles | PUCK'D</title>
    <!-- seo:start -->
    <meta name="description" content="Every PUCK'D story: breaking NHL news, trades, prospects, features and opinion.">
    <link rel="canonical" href="https://puckd.blog/articles.html">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="PUCK'D">
    <meta property="og:locale" content="en_US">
    <meta property="og:title" content="Articles | PUCK'D">
    <meta property="og:description" content="Every PUCK'D story: breaking NHL news, trades, prospects, features and opinion.">
    <meta property="og:url" content="https://puckd.blog/articles.html">
    <meta property="og:image" content="https://puckd.blog/og-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="PUCK'D: Hockey Lives Here">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@puckd_">
    <meta name="twitter:title" content="Articles | PUCK'D">
    <meta name="twitter:description" content="Every PUCK'D story: breaking NHL news, trades, prospects, features and opinion.">
    <meta name="twitter:image" content="https://puckd.blog/og-card.png">
    <meta name="twitter:image:alt" content="PUCK'D: Hockey Lives Here">
    <!-- seo:end -->
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <meta name="theme-color" content="#131922">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Shared Components -->
    <div id="ticker"></div>
    <div id="navbar"></div>

    <main class="wrap">

        <section class="articles-hero">

            <h1>Articles</h1>

        </section>

        <section class="tag-bar">

            <button class="tag active">All</button>
            <button class="tag">Breaking</button>
            <button class="tag">News</button>
            <button class="tag">Trades</button>
            <button class="tag">Prospects</button>
            <button class="tag">Opinion</button>
            <button class="tag">Features</button>

        </section>

        <section id="articles-list" class="articles-list" aria-busy="true">

            <!-- Loading placeholders; articles.js replaces these -->
            <div class="article-featured al-sk" aria-hidden="true">
                <div class="article-featured-image sk"></div>
                <div class="article-featured-body"><span class="sk sk-tag"></span><span class="sk sk-h"></span><span class="sk sk-h" style="width:60%"></span><span class="sk sk-text"></span><span class="sk sk-text short"></span></div>
            </div>
            <div class="article-link al-sk" aria-hidden="true"><article class="article-row"><div class="thumb sk"></div><div class="article-body"><span class="sk sk-tag"></span><span class="sk sk-h"></span><span class="sk sk-text"></span><span class="sk sk-text short"></span></div></article></div>
            <div class="article-link al-sk" aria-hidden="true"><article class="article-row"><div class="thumb sk"></div><div class="article-body"><span class="sk sk-tag"></span><span class="sk sk-h"></span><span class="sk sk-text"></span><span class="sk sk-text short"></span></div></article></div>
            <div class="article-link al-sk" aria-hidden="true"><article class="article-row"><div class="thumb sk"></div><div class="article-body"><span class="sk sk-tag"></span><span class="sk sk-h"></span><span class="sk sk-text"></span><span class="sk sk-text short"></span></div></article></div>

        </section>

    </main>

    <!-- Shared Footer -->
    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="script.js"></script>
<script src="navbar.js"></script>
<script src="articles.js"></script>
</body>
</html>
